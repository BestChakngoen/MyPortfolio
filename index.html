<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Cloud Edition</title>

    <!-- CSS Dependencies -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    animation: { 'fade-in': 'fadeIn 0.5s ease-out', 'fade-in-up': 'fadeInUp 0.5s ease-out' },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        fadeInUp: { '0%': { opacity: '0', transform: 'translateY(10px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #111827;
        }

        ::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #f97316;
        }

        /* Edit Mode Styles */
        .edit-control {
            display: none;
        }
        body.edit-mode-active .edit-control {
            display: inline-flex;
        }
        body.edit-mode-active [data-editable] {
            outline: 1px dashed rgba(249, 115, 22, 0.5);
            background-color: rgba(249, 115, 22, 0.05);
            padding-left: 4px;
            padding-right: 4px;
            border-radius: 4px;
            cursor: text;
        }
        body.edit-mode-active [data-editable]:focus {
            outline: 2px solid #f97316;
            background-color: rgba(249, 115, 22, 0.1);
        }
    </style>

    <!-- Global Initialization -->
    <script>
        window.PortfolioApp = {};
    </script>
</head>

<body class="bg-gray-900 text-gray-200">
    <div id="root"></div>

    <!-- Load Scripts -->
    <script src="./js/folio-data.js"></script>
    <script src="./js/folio-icons.js"></script>
    <script src="./js/folio-app.js"></script>
</body>

</html>
